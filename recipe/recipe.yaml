schema_version: 1

context:
  version: "2.14.2"

package:
  name: git-cliff
  version: ${{ version }}

source:
  url: https://github.com/orhun/git-cliff/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fbbb1f8ade8e9affeaacd632bedc94ac898fb726516f2f5a86d1bfba947635f4

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      LIBGIT2_NO_VENDOR: "1"
    content:
      - if: unix
        then:
          - export PKG_CONFIG="$BUILD_PREFIX/bin/pkg-config"
          - if: build_platform != target_platform
            then:
              # cc-rs also applies the generic CFLAGS to host (build script) compilations,
              # which breaks with target-only flags like `-mabi=lp64d` on riscv64.
              # Restrict them to the target triple instead.
              - export CFLAGS_${CARGO_BUILD_TARGET//-/_}="$CFLAGS"
              - export CXXFLAGS_${CARGO_BUILD_TARGET//-/_}="$CXXFLAGS"
              - unset CFLAGS CXXFLAGS
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path git-cliff
        else:
          # NOTE: somehow the linker is looking for ssh2.lib and not libssh2.lib.
          # Using RUSTFLAGS with `-l libssh2` does not work so the only solution found
          # so far is to copy libssh2.lib to ssh2.lib.
          # See:
          # - https://github.com/conda-forge/git-cliff-feedstock/pull/23#issuecomment-2695470356
          # - https://github.com/conda-forge/git-cliff-feedstock/pull/26
          # - https://github.com/conda-forge/libssh2-feedstock/issues/55
          - copy %LIBRARY_LIB%\libssh2.lib %LIBRARY_LIB%\ssh2.lib || exit 1
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path git-cliff || exit 1
          - del %LIBRARY_LIB%\ssh2.lib || exit 1
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - cargo-bundle-licenses
    - cargo-auditable
  host:
    - libgit2
    - libssh2
    # to build against libgit2 we also need the pkgconfig files for zlib
    - zlib

tests:
  - script:
      - git-cliff --help
      - git-cliff --version
  - package_contents:
      bin:
        - git-cliff
        - git-cliff-completions
        - git-cliff-mangen
      strict: true

about:
  summary: A highly customizable changelog generator
  description: A highly customizable Changelog Generator that follows Conventional Commit specifications ⛰️
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  homepage: https://git-cliff.org
  repository: https://github.com/orhun/git-cliff
  documentation: https://git-cliff.org/docs/

extra:
  recipe-maintainers:
    - orhun
    - pavelzw
